name: Validate site source

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source and generated discovery files
        run: npm test
      - name: Configure GitHub Pages build
        uses: actions/configure-pages@v5
      - name: Build the public site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
