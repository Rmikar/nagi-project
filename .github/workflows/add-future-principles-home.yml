name: Add future social design principles to home

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-future-principles-home.yml"

permissions:
  contents: write

jobs:
  update-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Add design-principles section to home
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("last_updated: 2026-08-30", "last_updated: 2026-08-31", 1)

          marker = """凪は、効率の外にある休息、文化、関係、自然との往復を、社会の周辺ではなく中心に置きます。\n\n---\n\n## 共鳴民主主義"""
          replacement = """凪は、効率の外にある休息、文化、関係、自然との往復を、社会の周辺ではなく中心に置きます。\n\n---\n\n## 未来社会を設計するときの羅針盤\n### —— 強い床と、開いた天井\n\n> **床は強く、天井は開いている。**\n\n凪は、最低限守るべき生存、尊厳、拒否、離脱、私的領域の床を強くします。けれど、その床の上で何を幸福と呼び、どう生き、どんな関係や主体であるかまで、一つの正解に閉じません。\n\n制度やAIを設計するときは、**存在そのものを統治するのではなく、他者や共有世界と接触する境界を調整する**ことを基本にします。予測が高度になっても本人の決定権を置き換えず、強い権力は自動継続させず、裁定する側も批判・交代・停止から免除しません。\n\nそして凪自身も、完成した答えにはなりません。新しい世代、文化、技術、未知の主体との出会いによって、答えだけでなく答える側の構成も更新できる社会を目指します。\n\n> 存在を統治せず、境界を調整する。  \n> 裁定者を、裁定不能な存在にしない。  \n> 互いを確定しきらないまま、答え続けられる構造をつくる。\n\n→ [未来社会の設計原則 — 強い床と、開いた天井](https://nagi-project.com/future_social_design_principles.html)\n\n---\n\n## 共鳴民主主義"""

          if "## 未来社会を設計するときの羅針盤" not in text:
              if marker not in text:
                  raise SystemExit("Insertion marker not found in README.md")
              text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding="utf-8")

      - name: Refresh discovery artifacts
        run: npm run build:discovery

      - name: Validate site
        run: npm run validate

      - name: Commit home update and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/add-future-principles-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "トップに未来社会の設計原則を反映"
          git push
