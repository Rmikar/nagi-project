title: 凪プロジェクト — 生存を所有と支配から解放する未来社会思想
description: 資本主義の代替案や未来の社会のあり方を考えるために、人の尊厳、生命基盤の非所有、共鳴民主主義、制度免疫から、生存を資本・国家・戦争への服従から切り離す未来社会思想。
author: "紬実花（TsumugiMika）"
logo: /assets/icon.svg
image: /assets/og/nagi-default.png

url: https://rmikar.github.io
baseurl: /nagi-project
canonical_url: https://rmikar.github.io/nagi-project/
lang: ja
timezone: Asia/Tokyo

markdown: kramdown
